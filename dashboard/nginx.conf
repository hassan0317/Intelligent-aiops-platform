server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # backend control plane (same-origin -> no CORS)
    location /api/ {
        # Re-resolve aiops-api via Docker's embedded DNS instead of caching the
        # IP at startup, so the dashboard survives an aiops-api rebuild/restart
        # (a static upstream goes 502 when the API container gets a new IP).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $aiops_api "aiops-api:8050";
        proxy_pass http://$aiops_api;       # full /api/... URI passed through
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    # Content-hashed build assets (Vite /assets/*) are immutable -> cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. Never cache the HTML shell, so a tab opened days ago always
    # boots the current app + polls the live state (no frozen "stale" dashboard).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
