# =============================================================================
# Prometheus — PHASE 3 baseline.
# Receives span-derived RED metrics + infra metrics via remote-write from the
# OTel Collector (--web.enable-remote-write-receiver, set in docker-compose).
# Phase 4 extends this with alerting rules + Alertmanager wiring.
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']   # Prometheus PUSHES alerts here (Fix #7)

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
